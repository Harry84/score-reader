services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: squadrons
      POSTGRES_PASSWORD: squadrons
      POSTGRES_DB: squadrons
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadrons"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
